<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" role="img" aria-label="Monitara AI">
  <defs>
    <linearGradient id="lkBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A44"/>
      <stop offset="1" stop-color="#0E1726"/>
    </linearGradient>
    <linearGradient id="lkEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#34A853"/>
      <stop offset="1" stop-color="#4285F4"/>
    </linearGradient>
    <clipPath id="lkShield">
      <path d="M60 8 L108 26 L108 70 C108 104 86 124 60 134 C34 124 12 104 12 70 L12 26 Z"/>
    </clipPath>
  </defs>

  <!-- shield mark, scaled into the left -->
  <g transform="translate(6,16) scale(0.62)">
    <path d="M60 8 L108 26 L108 70 C108 104 86 124 60 134 C34 124 12 104 12 70 L12 26 Z"
          fill="url(#lkBody)" stroke="url(#lkEdge)" stroke-width="3.5"/>
    <g clip-path="url(#lkShield)" stroke="#4285F4" stroke-opacity="0.20" stroke-width="1.3">
      <line x1="36" y1="10" x2="36" y2="132"/>
      <line x1="60" y1="8"  x2="60" y2="134"/>
      <line x1="84" y1="10" x2="84" y2="132"/>
      <line x1="6" y1="46" x2="114" y2="46"/>
      <line x1="6" y1="74" x2="114" y2="74"/>
      <line x1="6" y1="100" x2="114" y2="100"/>
    </g>
    <g clip-path="url(#lkShield)">
      <circle cx="36" cy="46" r="3.4" fill="#4285F4"/>
      <circle cx="84" cy="46" r="3.4" fill="#EA4335"/>
      <circle cx="36" cy="100" r="3.4" fill="#FBBC05"/>
      <circle cx="84" cy="100" r="3.4" fill="#34A853"/>
      <circle cx="60" cy="46" r="2.4" fill="#FBBC05"/>
      <circle cx="36" cy="74" r="2.4" fill="#34A853"/>
      <circle cx="84" cy="74" r="2.4" fill="#4285F4"/>
    </g>
    <circle cx="60" cy="74" r="27" fill="#4285F4" fill-opacity="0.10"/>
    <path d="M45 74 L56 86 L78 57" fill="none" stroke="#34A853" stroke-width="8.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 74 L56 86 L78 57" fill="none" stroke="#FFFFFF" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/>
  </g>

  <!-- wordmark: M-o-n-i-t-a-r-a in Google brand colours -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    <text x="96" y="62">
      <tspan fill="#4285F4">M</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">n</tspan><tspan fill="#34A853">i</tspan><tspan fill="#4285F4">t</tspan><tspan fill="#EA4335">a</tspan><tspan fill="#FBBC05">r</tspan><tspan fill="#34A853">a</tspan>
    </text>
    <text x="96" y="100" font-size="28" font-weight="700" letter-spacing="0">
      <tspan fill="#EA4335">A</tspan><tspan fill="#FBBC05">I</tspan><tspan fill="#94A3B8" font-size="15" font-weight="600" letter-spacing="1.5"> · SECURITY POSTURE</tspan>
    </text>
  </g>
</svg>
