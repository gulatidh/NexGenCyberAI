<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7675"/>
      <stop offset="100%" stop-color="#00CEC9"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- Owl body -->
  <ellipse cx="32" cy="38" rx="13" ry="14" fill="white" opacity="0.92"/>
  <!-- Left eye -->
  <circle cx="26" cy="30" r="6" fill="white"/>
  <circle cx="26" cy="30" r="4" fill="#2D3436"/>
  <circle cx="27.5" cy="28.5" r="1.2" fill="white"/>
  <!-- Right eye -->
  <circle cx="38" cy="30" r="6" fill="white"/>
  <circle cx="38" cy="30" r="4" fill="#2D3436"/>
  <circle cx="39.5" cy="28.5" r="1.2" fill="white"/>
  <!-- Beak -->
  <polygon points="32,34 29.5,37 34.5,37" fill="#FDCB6E"/>
  <!-- Ear tufts -->
  <polygon points="23,22 21,14 27,20" fill="white" opacity="0.92"/>
  <polygon points="41,22 43,14 37,20" fill="white" opacity="0.92"/>
  <!-- Wing hints -->
  <ellipse cx="20" cy="42" rx="7" ry="5" fill="white" opacity="0.5" transform="rotate(-20 20 42)"/>
  <ellipse cx="44" cy="42" rx="7" ry="5" fill="white" opacity="0.5" transform="rotate(20 44 42)"/>
</svg>
