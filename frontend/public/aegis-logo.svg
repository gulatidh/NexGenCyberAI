<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON -->
  <g transform="translate(10, 5)">
    <polygon points="60,10 105,35 105,85 60,110 15,85 15,35" fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="28" fill="none" stroke="#00F2FE" stroke-width="2" stroke-dasharray="4 3" opacity="0.65" />
    <path d="M38 74 L38 48 L60 66 L82 48 L82 74" fill="none" stroke="url(#iconGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="60" cy="42" r="5" fill="#00F2FE" filter="url(#glow)"/>
    <circle cx="105" cy="35" r="4.5" fill="#818CF8" />
    <circle cx="15" cy="85" r="4.5" fill="#00F2FE" />
  </g>

  <!-- WORDMARK -->
  <g transform="translate(140, 75)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="900" letter-spacing="6" fill="url(#textGrad)">MONITARA</text>
  </g>

  <!-- PULSE UNDERLINE -->
  <g transform="translate(140, 92)">
    <path d="M 5 0 L 120 0 L 130 -12 L 140 12 L 150 -6 L 160 4 L 170 0 L 385 0" fill="none" stroke="url(#pulseGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="140" cy="12" r="4" fill="#00F2FE" filter="url(#glow)" />
  </g>
</svg>
