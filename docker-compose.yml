version: "3.9"

services:
  aegis:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "http://localhost:${PORT:-8080}/api/v1"
        REACT_APP_CLIENT_ID: "${REACT_APP_CLIENT_ID}"
        REACT_APP_TENANT_ID: "${REACT_APP_TENANT_ID}"
        REACT_APP_REDIRECT_URI: "http://localhost:${PORT:-8080}"
    image: aegis-local:latest
    container_name: aegis-portal
    ports:
      - "${PORT:-8080}:8000"
    volumes:
      - aegis_data:/app/data
    environment:
      DATABASE_URL: "sqlite:////app/data/nexgencyberai.db"
      SERVE_FRONTEND: "true"
      ALLOWED_ORIGINS: '["http://localhost:${PORT:-8080}"]'
      AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
      AZURE_CLIENT_ID: "${REACT_APP_CLIENT_ID}"
      INITIAL_ADMIN_EMAILS: "${INITIAL_ADMIN_EMAILS}"
      # AI Providers — configure at least one
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
      AZURE_OPENAI_DEPLOYMENT: "${AZURE_OPENAI_DEPLOYMENT:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    restart: unless-stopped

volumes:
  aegis_data:
    driver: local
