##############################################################################
# NexGenCyberAI — Docker Compose (local development)
# Usage:
#   cp .env.example .env      # fill in your credentials
#   docker-compose up --build
##############################################################################

version: "3.9"

services:
  # ── PostgreSQL / SQLite swap for local dev ──────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexgencyberai
      POSTGRES_USER: nexgen
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  # ── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://nexgen:localdevpassword@db:5432/nexgencyberai"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      - redis
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://nexgen:localdevpassword@db:5432/nexgencyberai"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
    command: celery -A tasks.celery_app worker --loglevel=info

  # ── Frontend SPA ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      REACT_APP_API_URL: "http://localhost:8000/api/v1"
    volumes:
      - ./frontend/src:/app/src

volumes:
  pgdata:
