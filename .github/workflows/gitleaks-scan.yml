name: Gitleaks Scan

# Triggered by the NexGenCyberAI backend (workflow_dispatch). Clones a
# target repo and runs Gitleaks across its full git history, then POSTs
# findings to /api/v1/scans/ingest/.

on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: "Scan UUID created by the API"
        required: true
      scan_token:
        description: "Per-scan HMAC token (do not log)"
        required: true
      api_base:
        description: "Public API base URL"
        required: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Run Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch scan config from API
        id: cfg
        env:
          API_BASE: ${{ inputs.api_base }}
          SCAN_ID: ${{ inputs.scan_id }}
          SCAN_TOKEN: ${{ inputs.scan_token }}
        run: |
          set -euo pipefail
          curl -fsS \
            "${API_BASE}/api/v1/scans/config/?scan_id=${SCAN_ID}&scan_token=${SCAN_TOKEN}" \
            -o cfg.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, urllib.parse as up
          c = json.load(open("cfg.json"))
          repo = c.get("repo_url") or ""
          # Inject PAT into the URL for private-repo clone, if provided.
          user = c.get("git_username") or "x-access-token"
          tok = c.get("git_token") or ""
          if repo.startswith("https://") and tok:
              # https://USER:TOK@host/...
              host_and_path = repo[len("https://"):]
              repo_auth = f"https://{up.quote(user, safe='')}:{up.quote(tok, safe='')}@{host_and_path}"
          else:
              repo_auth = repo
          print(f"repo_url={repo}")
          print(f"repo_clone_url={repo_auth}")
          PY

      - name: Clone target repo (full history)
        if: steps.cfg.outputs.repo_url != ''
        run: |
          git clone "${{ steps.cfg.outputs.repo_clone_url }}" target

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.18.4
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O gl.tgz
          tar -xzf gl.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        if: steps.cfg.outputs.repo_url != ''
        run: |
          gitleaks detect --source target --report-format json --report-path results.json --no-banner --exit-code 0

      - name: Post findings to API
        if: always()
        env:
          API_BASE: ${{ inputs.api_base }}
          SCAN_ID: ${{ inputs.scan_id }}
          SCAN_TOKEN: ${{ inputs.scan_token }}
          REPO_URL: ${{ steps.cfg.outputs.repo_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          findings = []
          err = None
          repo = os.environ.get("REPO_URL", "")
          if os.path.exists("results.json"):
              try:
                  data = json.load(open("results.json"))
                  for item in data or []:
                      # Secrets are always high — leaked credentials are
                      # immediately exploitable. Verified webhook keys are
                      # critical but we can't tell verification status here.
                      findings.append({
                          "title": f"Secret detected: {item.get('RuleID') or item.get('Description','secret')}",
                          "description": (item.get("Description") or "")[:4000],
                          "severity": "high",
                          "resource_id": f"{item.get('File','')}:{item.get('StartLine','')}",
                          "resource_type": "file",
                          "control_id": item.get("RuleID") or "GITLEAKS",
                          "remediation": "Rotate the leaked credential immediately. Remove from git history (BFG / git-filter-repo). Add the pattern to allowlist if it's a known test fixture.",
                          "evidence": {
                              "file": item.get("File"),
                              "line": item.get("StartLine"),
                              "commit": item.get("Commit"),
                              "author": item.get("Author"),
                              "date": item.get("Date"),
                              "rule": item.get("RuleID"),
                              # Don't echo the secret itself
                          },
                          "control_mappings": {},
                      })
              except Exception as e:
                  err = f"Failed to parse Gitleaks report: {e}"
          elif not repo:
              err = "No repo_url configured for scan"

          payload = {"scan_id": os.environ["SCAN_ID"],
                     "scan_token": os.environ["SCAN_TOKEN"],
                     "findings": findings,
                     "error": err if not findings and err else None}
          req = urllib.request.Request(
              f"{os.environ['API_BASE']}/api/v1/scans/ingest/",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}, method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("ingest status:", r.status, r.read().decode("utf-8")[:200])
          except urllib.error.HTTPError as e:
              print("ingest failed:", e.code, e.read().decode("utf-8")[:400])
              raise
          PY
