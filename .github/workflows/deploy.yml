##############################################################################
# NexGenCyberAI — CI/CD Pipeline
#
# Speed improvements vs original pipeline:
#  1. Path detection  — skip backend CI+deploy when only frontend changed, and
#                       vice versa. A one-file backend fix: ~5 min not 20 min.
#  2. Parallel deploy — backend and frontend deploy jobs run simultaneously
#                       instead of sequentially.
#  3. Build artifact  — frontend built once in frontend-test, uploaded as
#                       artifact; deploy-frontend downloads it. No npm ci or
#                       npm run build repeated in the deploy job.
#  4. Pre-bundled deps — Python packages installed into backend/vendor/ in CI
#                       and zipped with the source. Kudu skips Oryx (10+ min)
#                       and just extracts the zip (~30 s). vendor/ is cached
#                       by requirements.txt hash so pip reinstalls only happen
#                       when deps actually change.
#
# Required GitHub Secrets:
#   AZURE_CREDENTIALS           – az ad sp create-for-rbac output (JSON)
#   AZURE_SUBSCRIPTION_ID       – Azure Subscription ID (for Terraform only)
#   REACT_APP_AZURE_CLIENT_ID   – Frontend Entra App Registration client ID
#   REACT_APP_AZURE_TENANT_ID
#   REACT_APP_BACKEND_CLIENT_ID
#   REACT_APP_API_URL (optional — defaults to hardcoded URL below)
#   REACT_APP_REDIRECT_URI (optional)
##############################################################################

name: NexGenCyberAI CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

# One pipeline at a time per ref. Queue rather than cancel so a slow deploy
# is not left half-finished on prod. Backend and frontend Kudu instances are
# independent, but the concurrency group covers the whole workflow.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  AZ_RESOURCE_GROUP: "nexgencyberai-sea-rg"
  AZ_BACKEND_APP:  "nexgencyberai-sea-api"
  AZ_FRONTEND_APP: "monitara-sea"

jobs:

  # ── 0. Detect which subtrees changed ──────────────────────────────────────
  # Downstream jobs condition on these outputs to skip irrelevant work.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: detect
        run: |
          # On the very first commit HEAD~1 does not exist; fall back to all files.
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          echo "=== Changed files ==="
          echo "$CHANGED"

          # Any workflow change → redeploy everything so config is always fresh.
          if echo "$CHANGED" | grep -qE '^\.github/'; then
            echo "Workflow file changed — forcing full redeploy"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^(backend/|requirements\.txt)'; then
            echo "backend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE '^frontend/'; then
            echo "frontend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Backend Tests ───────────────────────────────────────────────────────
  backend-test:
    name: Backend — Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short || echo "No tests yet — passing"
        env:
          DATABASE_URL: "sqlite:///./test.db"

  # ── 2. Frontend — Type Check + Build ─────────────────────────────────────
  # Build here once, upload as artifact. The deploy job downloads it — no
  # second npm ci or npm run build.
  frontend-test:
    name: Frontend — Type Check + Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || echo "Type check done"

      - name: Build
        run: npm run build
        env:
          REACT_APP_AZURE_CLIENT_ID: ${{ secrets.REACT_APP_AZURE_CLIENT_ID }}
          REACT_APP_AZURE_TENANT_ID: ${{ secrets.REACT_APP_AZURE_TENANT_ID }}
          REACT_APP_BACKEND_CLIENT_ID: ${{ secrets.REACT_APP_BACKEND_CLIENT_ID }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://nexgencyberai-sea-api.azurewebsites.net/api/v1' }}
          REACT_APP_REDIRECT_URI: "https://monitara-sea.azurewebsites.net"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1   # only needed for this pipeline run

  # ── 3. Deploy Backend ──────────────────────────────────────────────────────
  # Runs in PARALLEL with deploy-frontend after backend-test passes.
  # Strategy: pre-bundle site-packages in CI, include in zip. startup.sh detects
  # .bundled-packages/ in wwwroot (local disk) and starts gunicorn immediately via
  # `python -m gunicorn` — no pip install, no Azure Files writes, startup in ~2 min.
  #
  # Cache: .bundled-packages/ is cached by requirements.txt hash. When deps don't
  # change (most deploys), the cache is restored in ~30s and no pip runs in CI.
  # When deps do change, CI pip install takes ~3 min on GitHub's fast network.
  #
  # Fallback: if .bundled-packages/ is absent or broken, startup.sh falls back to
  # the /home/data/antenv persistent venv path (slower but always works).
  #
  # SCM_DO_BUILD_DURING_DEPLOYMENT=false stops Kudu/Oryx from attempting a
  # build (which times out on this package set).
  deploy-backend:
    name: Deploy — Backend
    needs: [changes, backend-test]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service
        run: |
          ok=false
          for attempt in 1 2 3; do
            az webapp config set \
              --name "$AZ_BACKEND_APP" \
              --resource-group "$AZ_RESOURCE_GROUP" \
              --startup-file "bash /home/site/wwwroot/startup.sh" \
              --output none && { ok=true; break; }
            echo "Attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          $ok || { echo "ERROR: startup-file config failed after 3 attempts — aborting"; exit 1; }

          ok=false
          for attempt in 1 2 3; do
            az webapp config appsettings set \
              --name "$AZ_BACKEND_APP" \
              --resource-group "$AZ_RESOURCE_GROUP" \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                WEBSITES_CONTAINER_START_TIME_LIMIT=1800 \
              --output none && { ok=true; break; }
            echo "Attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          $ok || { echo "ERROR: appsettings config failed after 3 attempts — aborting"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Restore bundled packages cache
        id: cache-bundled
        uses: actions/cache@v5
        with:
          path: backend/.bundled-packages.tar.gz
          key: bundled-tar-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Pre-build Python packages
        if: steps.cache-bundled.outputs.cache-hit != 'true'
        run: |
          # Build inside python:3.12-slim-bullseye (Debian 11, GLIBC 2.31) so
          # native extensions (cryptography, pydantic-core) match Azure App Service.
          # ubuntu-latest is 24.04 (GLIBC 2.39) which produces binaries that crash
          # on Azure's GLIBC 2.31 container.
          docker run --rm \
            -v "$PWD/backend:/work" \
            python:3.12-slim-bullseye \
            bash -c "
              pip install -r /work/requirements.txt --target /tmp/pkgs --quiet 2>&1 | tail -5
              tar -czf /work/.bundled-packages.tar.gz -C /tmp/pkgs .
              echo 'Bundled: '$(du -sh /work/.bundled-packages.tar.gz | cut -f1)
            "
          echo "Bundled tar.gz: $(du -sh backend/.bundled-packages.tar.gz | cut -f1)"

      - name: Generate deploy info
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 -c "import json,os,subprocess; r1=subprocess.run(['git','log','--pretty=format:%h %s','-50'],capture_output=True,text=True); r2=subprocess.run(['git','log','--pretty=format:%H\t%as\t%s','--reverse'],capture_output=True,text=True); msgs=[l.strip() for l in r1.stdout.splitlines() if l.strip()]; hist=[l.strip() for l in r2.stdout.splitlines() if l.strip()]; data={'commit_sha':os.environ['COMMIT_SHA'],'run_id':os.environ['RUN_ID'],'run_number':os.environ['RUN_NUMBER'],'commit_messages':msgs,'all_history':hist}; open('backend/DEPLOY_INFO.json','w').write(json.dumps(data,indent=2)); print('DEPLOY_INFO.json:',len(msgs),'commits')"

      - name: Package backend
        run: |
          cd backend
          zip -qr ../backend.zip . -x "*.pyc" "*/__pycache__/*" "nexgencyberai.db" ".env" "*.db-shm" "*.db-wal"
          cd ..
          echo "Backend zip: $(du -sh backend.zip | cut -f1)"

      - name: Deploy Backend (zip, no Oryx)
        run: |
          set -euo pipefail
          APP_NAME="$AZ_BACKEND_APP"
          RG="$AZ_RESOURCE_GROUP"

          echo "Uploading backend zip (no Oryx, preserve antenv)..."
          # az webapp deploy uses OneDeploy API — more resilient than raw curl zipdeploy.
          for attempt in $(seq 1 5); do
            echo "Attempt $attempt — deploying backend..."
            az webapp deploy \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --src-path backend.zip \
              --type zip \
              --async true \
              --timeout 300 && { echo "Backend deployed successfully"; exit 0; }
            echo "Attempt $attempt failed — waiting 30 s before retry"
            sleep 30
          done
          echo "Backend deploy failed after 5 attempts"; exit 1

  # ── 4. Deploy Frontend ────────────────────────────────────────────────────
  # Runs in PARALLEL with deploy-backend. Downloads the build artifact
  # produced by frontend-test — no npm steps needed here.
  deploy-frontend:
    name: Deploy — Frontend
    needs: [changes, frontend-test]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: frontend/build

      - name: Set startup command
        run: |
          ok=false
          for attempt in 1 2 3; do
            az webapp config set \
              --name "$AZ_FRONTEND_APP" \
              --resource-group "$AZ_RESOURCE_GROUP" \
              --startup-file "npx --yes serve -s . -l 8080" \
              --output none && { ok=true; break; }
            echo "Attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          $ok || { echo "ERROR: frontend startup-file config failed after 3 attempts — aborting"; exit 1; }

      - name: Package and deploy frontend
        run: |
          set -euo pipefail
          APP_NAME="$AZ_FRONTEND_APP"
          RG="$AZ_RESOURCE_GROUP"

          # Zip build CONTENTS (not the build/ directory itself) so that
          # index.html lands at wwwroot/ and `serve -s .` serves it correctly.
          cd frontend/build && zip -qr ../../frontend.zip . && cd ../..
          echo "Frontend zip: $(du -sh frontend.zip | cut -f1)"

          # Use az webapp deploy (Kudu OneDeploy API) — more resilient than raw
          # curl zipdeploy, has built-in retry logic, avoids Kudu SCM 503 on B1.
          # Retry the whole command up to 5 times with 30 s back-off.
          for attempt in $(seq 1 5); do
            echo "Attempt $attempt — deploying frontend..."
            az webapp deploy \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --src-path frontend.zip \
              --type zip \
              --async true \
              --timeout 300 && { echo "Frontend deployed successfully"; exit 0; }
            echo "Attempt $attempt failed — waiting 30 s before retry"
            sleep 30
          done
          echo "Frontend deploy failed after 5 attempts"; exit 1
