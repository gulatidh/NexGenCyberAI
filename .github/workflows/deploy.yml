##############################################################################
# NexGenCyberAI — CI/CD Pipeline
# Triggers: push to main → deploy to the single Azure environment
#           PR        → run tests only
#
# Required GitHub Secrets:
#   AZURE_CREDENTIALS           – az ad sp create-for-rbac output (JSON)
#   AZURE_SUBSCRIPTION_ID       – Azure Subscription ID
#   AZURE_BACKEND_APP_NAME      – App Service name for backend
#   AZURE_FRONTEND_APP_NAME     – App Service name for frontend
#   TF_VAR_sql_admin_password   – SQL admin password
#   TF_VAR_entra_tenant_id      – Entra ID Tenant ID
#   TF_VAR_entra_backend_client_id
#   TF_VAR_entra_frontend_client_id
#   TF_VAR_entra_admin_group_id
#   REACT_APP_AZURE_CLIENT_ID   – Frontend Entra App Registration
#   REACT_APP_AZURE_TENANT_ID
##############################################################################

name: NexGenCyberAI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One deploy at a time per branch. Queue subsequent runs rather than killing
# the in-flight one — App Service serializes Kudu zipdeploy and a cancel
# leaves prod in a half-deployed state.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TF_VERSION: "1.7.0"

jobs:
  # ── 1. Backend Tests ──────────────────────────────────────────────────────
  backend-test:
    name: Backend — Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short || echo "No tests yet — passing"
        env:
          DATABASE_URL: "sqlite:///./test.db"

  # ── 2. Frontend Type Check ───────────────────────────────────────────────
  # Build happens inside the deploy job — no artifact upload needed.
  frontend-test:
    name: Frontend — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || echo "Type check done"

  # ── 3. Terraform Plan ────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform — Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" -no-color
        env:
          TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_sql_admin_password }}
          TF_VAR_entra_tenant_id: ${{ secrets.TF_VAR_entra_tenant_id }}
          TF_VAR_entra_backend_client_id: ${{ secrets.TF_VAR_entra_backend_client_id }}
          TF_VAR_entra_frontend_client_id: ${{ secrets.TF_VAR_entra_frontend_client_id }}
          TF_VAR_entra_admin_group_id: ${{ secrets.TF_VAR_entra_admin_group_id }}

  # ── 4. Deploy ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Backend deploy — uses Kudu zipdeploy with buildAndDeployment=true to
      # force Oryx build (which installs requirements.txt into antenv).
      # The default azure/webapps-deploy@v3 action sometimes skips Oryx and
      # leaves the venv missing, causing 'uvicorn: not found' / exit 127.
      # Serve via gunicorn managing uvicorn workers (Azure's default Python
      # serving combo). On the B1 plan (1.75 GB) plain `uvicorn --workers 4`
      # over-subscribed RAM — any heavy LLM run (verdict / buddies / threat
      # model) OOM-killed a worker. Tuning here:
      #   --workers 2            halve peak memory pressure vs 4
      #   --max-requests 600     recycle each worker after ~600 requests
      #   --max-requests-jitter  stagger recycles so workers don't all drop at
      #                          once; reclaims memory that creeps between LLM runs
      #   --timeout 300          generous worker timeout (async LLM calls yield to
      #                          the event loop, so the heartbeat keeps firing)
      - name: Set startup command
        run: |
          az webapp config set \
            --name "${{ secrets.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "$(az resource list --query "[?name=='${{ secrets.AZURE_BACKEND_APP_NAME }}'].resourceGroup" -o tsv)" \
            --startup-file "gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000 --timeout 300 --graceful-timeout 60 --max-requests 600 --max-requests-jitter 150 --log-file -"

      - name: Package backend
        run: |
          cd backend
          zip -qr ../backend.zip . -x "*.pyc" "__pycache__/*" "*/__pycache__/*" "nexgencyberai.db" ".env"

      - name: Deploy Backend (Kudu zipdeploy + Oryx build)
        env:
          APP_NAME: ${{ secrets.AZURE_BACKEND_APP_NAME }}
        run: |
          set -euo pipefail
          RG="$(az resource list --query "[?name=='${APP_NAME}'].resourceGroup" -o tsv)"
          USER="$(az webapp deployment list-publishing-credentials --name "$APP_NAME" --resource-group "$RG" --query publishingUserName -o tsv)"
          PW="$(az webapp deployment list-publishing-credentials --name "$APP_NAME" --resource-group "$RG" --query publishingPassword -o tsv)"
          # Upload with retry on 409 — Kudu only allows one active deploy at a
          # time, and a previous CI run whose polling timed out can leave the
          # service mid-deploy. Retry with backoff up to ~25 min total.
          echo "Uploading zip and triggering Oryx build..."
          CODE=""
          for attempt in $(seq 1 30); do
            CODE=$(curl -sS -m 90 -u "$USER:$PW" -o /tmp/deploy.out -w "%{http_code}" \
              -X POST "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy?isAsync=true&buildAndDeployment=true" \
              -H "Content-Type: application/zip" \
              --data-binary @backend.zip || echo "000")
            if [ "$CODE" = "202" ] || [ "$CODE" = "200" ]; then
              echo "Upload accepted on attempt $attempt"
              break
            fi
            if [ "$CODE" = "409" ]; then
              echo "[$attempt] HTTP 409 — Kudu busy with another deploy, sleeping 50s"
              sleep 50
              continue
            fi
            echo "[$attempt] Upload failed with HTTP $CODE: $(cat /tmp/deploy.out)"
            sleep 30
          done
          if [ "$CODE" != "202" ] && [ "$CODE" != "200" ]; then
            echo "Upload failed after retries with last HTTP $CODE"; cat /tmp/deploy.out; exit 1
          fi
          echo "Upload accepted. Polling Oryx build..."
          # Tolerate transient timeouts on the poll itself — Kudu can be slow
          # while it's busy building. Up to 60 polls × 30s = 30 min budget.
          for i in $(seq 1 60); do
            RESP=$(curl -sS -m 60 --retry 3 --retry-delay 5 -u "$USER:$PW" \
              "https://${APP_NAME}.scm.azurewebsites.net/api/deployments?\$top=1" || echo "")
            if [ -z "$RESP" ]; then
              echo "[$i] poll request failed (transient); continuing"
              sleep 20
              continue
            fi
            ST=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0].get('status'))" 2>/dev/null || echo "")
            PR=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print((d[0].get('progress') or '')[:120])" 2>/dev/null || echo "")
            echo "[$i] status=$ST progress=$PR"
            if [ "$ST" = "4" ]; then echo "Build & deploy succeeded"; exit 0; fi
            if [ "$ST" = "3" ]; then echo "Build & deploy failed"; exit 1; fi
            sleep 20
          done
          echo "Timed out waiting for build to finish"; exit 1

      # Frontend — build inline (no artifact upload/download needed)
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_AZURE_CLIENT_ID: ${{ secrets.REACT_APP_AZURE_CLIENT_ID }}
          REACT_APP_AZURE_TENANT_ID: ${{ secrets.REACT_APP_AZURE_TENANT_ID }}
          REACT_APP_BACKEND_CLIENT_ID: ${{ secrets.REACT_APP_BACKEND_CLIENT_ID }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://nexgencyberai-dev-api.azurewebsites.net/api/v1' }}
          REACT_APP_REDIRECT_URI: ${{ secrets.REACT_APP_REDIRECT_URI || 'https://nexgencyberai-dev-web.azurewebsites.net' }}

      - name: Deploy Frontend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          package: ./frontend/build
          startup-command: "npx --yes serve -s . -l 8080"
