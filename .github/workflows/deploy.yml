##############################################################################
# NexGenCyberAI — CI/CD Pipeline
#
# Speed improvements vs original pipeline:
#  1. Path detection  — skip backend CI+deploy when only frontend changed, and
#                       vice versa. A one-file backend fix: ~5 min not 20 min.
#  2. Parallel deploy — backend and frontend deploy jobs run simultaneously
#                       instead of sequentially.
#  3. Build artifact  — frontend built once in frontend-test, uploaded as
#                       artifact; deploy-frontend downloads it. No npm ci or
#                       npm run build repeated in the deploy job.
#  4. Pre-bundled deps — Python packages installed into backend/vendor/ in CI
#                       and zipped with the source. Kudu skips Oryx (10+ min)
#                       and just extracts the zip (~30 s). vendor/ is cached
#                       by requirements.txt hash so pip reinstalls only happen
#                       when deps actually change.
#
# Required GitHub Secrets:
#   AZURE_CREDENTIALS           – az ad sp create-for-rbac output (JSON)
#   AZURE_SUBSCRIPTION_ID       – Azure Subscription ID (for Terraform only)
#   REACT_APP_AZURE_CLIENT_ID   – Frontend Entra App Registration client ID
#   REACT_APP_AZURE_TENANT_ID
#   REACT_APP_BACKEND_CLIENT_ID
#   REACT_APP_API_URL (optional — defaults to hardcoded URL below)
#   REACT_APP_REDIRECT_URI (optional)
##############################################################################

name: NexGenCyberAI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One pipeline at a time per ref. Queue rather than cancel so a slow deploy
# is not left half-finished on prod. Backend and frontend Kudu instances are
# independent, but the concurrency group covers the whole workflow.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  AZ_RESOURCE_GROUP: "nexgencyberai-dev-rg"
  AZ_BACKEND_APP:  "nexgencyberai-dev-okxksu-api"
  AZ_FRONTEND_APP: "nexgencyberai-dev-okxksu-web"

jobs:

  # ── 0. Detect which subtrees changed ──────────────────────────────────────
  # Downstream jobs condition on these outputs to skip irrelevant work.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: detect
        run: |
          # On the very first commit HEAD~1 does not exist; fall back to all files.
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          echo "=== Changed files ==="
          echo "$CHANGED"

          # Any workflow change → redeploy everything so config is always fresh.
          if echo "$CHANGED" | grep -qE '^\.github/'; then
            echo "Workflow file changed — forcing full redeploy"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^(backend/|requirements\.txt)'; then
            echo "backend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE '^frontend/'; then
            echo "frontend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Backend Tests ───────────────────────────────────────────────────────
  backend-test:
    name: Backend — Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short || echo "No tests yet — passing"
        env:
          DATABASE_URL: "sqlite:///./test.db"

  # ── 2. Frontend — Type Check + Build ─────────────────────────────────────
  # Build here once, upload as artifact. The deploy job downloads it — no
  # second npm ci or npm run build.
  frontend-test:
    name: Frontend — Type Check + Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || echo "Type check done"

      - name: Build
        run: npm run build
        env:
          REACT_APP_AZURE_CLIENT_ID: ${{ secrets.REACT_APP_AZURE_CLIENT_ID }}
          REACT_APP_AZURE_TENANT_ID: ${{ secrets.REACT_APP_AZURE_TENANT_ID }}
          REACT_APP_BACKEND_CLIENT_ID: ${{ secrets.REACT_APP_BACKEND_CLIENT_ID }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://nexgencyberai-dev-okxksu-api.azurewebsites.net/api/v1' }}
          REACT_APP_REDIRECT_URI: ${{ secrets.REACT_APP_REDIRECT_URI || 'https://nexgencyberai-dev-okxksu-web.azurewebsites.net' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1   # only needed for this pipeline run

  # ── 3. Deploy Backend ──────────────────────────────────────────────────────
  # Runs in PARALLEL with deploy-frontend after backend-test passes.
  #
  # Pre-bundled deps strategy (eliminates 10+ min Oryx build):
  #   • pip install --target backend/vendor/  →  included in zip
  #   • startup: PYTHONPATH=/home/site/wwwroot/vendor python3 -m gunicorn ...
  #   • zipdeploy with buildAndDeployment=false  →  Kudu extracts zip only
  #   • vendor/ is cached by requirements.txt hash — pip runs only when deps change
  deploy-backend:
    name: Deploy — Backend
    needs: [changes, backend-test]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set startup command
        run: |
          # PYTHONPATH points to the vendor/ bundle baked into the zip so the
          # app doesn't need Oryx or an antenv virtual environment.
          az webapp config set \
            --name "$AZ_BACKEND_APP" \
            --resource-group "$AZ_RESOURCE_GROUP" \
            --startup-file "PYTHONPATH=/home/site/wwwroot/vendor python3 -m gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000 --timeout 300 --graceful-timeout 60 --max-requests 600 --max-requests-jitter 150 --log-file -"

      - name: Restore vendor cache
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-vendor-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-vendor-py${{ env.PYTHON_VERSION }}-

      - name: Bundle Python dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — installing deps into backend/vendor/"
          pip install -r backend/requirements.txt --target backend/vendor --quiet
          echo "Vendor size: $(du -sh backend/vendor | cut -f1)"

      - name: Generate deploy info
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 -c "
          import json, os, subprocess
          r1 = subprocess.run(['git','log','--pretty=format:%h %s','-50'], capture_output=True, text=True)
          r2 = subprocess.run(['git','log','--pretty=format:%H\t%as\t%s','--reverse'], capture_output=True, text=True)
          msgs = [l.strip() for l in r1.stdout.splitlines() if l.strip()]
          hist = [l.strip() for l in r2.stdout.splitlines() if l.strip()]
          data = {'commit_sha': os.environ['COMMIT_SHA'], 'run_id': os.environ['RUN_ID'],
                  'run_number': os.environ['RUN_NUMBER'], 'commit_messages': msgs, 'all_history': hist}
          open('backend/DEPLOY_INFO.json','w').write(json.dumps(data, indent=2))
          print('DEPLOY_INFO.json:', len(msgs), 'commits,', len(hist), 'history entries')
          "

      - name: Package backend
        run: |
          cd backend
          zip -qr ../backend.zip . \
            -x "*.pyc" "__pycache__/*" "*/__pycache__/*" \
            -x "nexgencyberai.db" ".env" "*.db-shm" "*.db-wal" \
            -x "vendor/*.dist-info/*" "vendor/*.data/*"
          cd ..
          echo "Backend zip: $(du -sh backend.zip | cut -f1)"

      - name: Deploy Backend
        run: |
          set -euo pipefail
          APP_NAME="$AZ_BACKEND_APP"
          RG="$AZ_RESOURCE_GROUP"

          USER="$(az webapp deployment list-publishing-credentials \
            --name "$APP_NAME" --resource-group "$RG" \
            --query publishingUserName -o tsv)"
          PW="$(az webapp deployment list-publishing-credentials \
            --name "$APP_NAME" --resource-group "$RG" \
            --query publishingPassword -o tsv)"

          # buildAndDeployment=false → skip Oryx; deps are in vendor/.
          # isAsync=false → synchronous; 200 means done, no polling loop needed.
          echo "Uploading backend zip (no Oryx)..."
          for attempt in $(seq 1 5); do
            CODE=$(curl -sS -m 300 -u "$USER:$PW" -o /tmp/be_deploy.out -w "%{http_code}" \
              -X POST "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy?isAsync=false&buildAndDeployment=false" \
              -H "Content-Type: application/zip" \
              --data-binary @backend.zip || echo "000")
            echo "Attempt $attempt → HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "Backend deployed successfully"; exit 0; }
            if [ "$CODE" = "409" ]; then
              echo "Kudu busy — waiting 60 s before retry"
              sleep 60; continue
            fi
            echo "Unexpected response: $(cat /tmp/be_deploy.out)"
            sleep 30
          done
          echo "Backend deploy failed after 5 attempts (last HTTP $CODE)"; exit 1

  # ── 4. Deploy Frontend ────────────────────────────────────────────────────
  # Runs in PARALLEL with deploy-backend. Downloads the build artifact
  # produced by frontend-test — no npm steps needed here.
  deploy-frontend:
    name: Deploy — Frontend
    needs: [changes, frontend-test]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

      - name: Set startup command
        run: |
          az webapp config set \
            --name "$AZ_FRONTEND_APP" \
            --resource-group "$AZ_RESOURCE_GROUP" \
            --startup-file "npx --yes serve -s . -l 8080"

      - name: Package and deploy frontend
        run: |
          set -euo pipefail
          APP_NAME="$AZ_FRONTEND_APP"
          RG="$AZ_RESOURCE_GROUP"

          USER="$(az webapp deployment list-publishing-credentials \
            --name "$APP_NAME" --resource-group "$RG" \
            --query publishingUserName -o tsv)"
          PW="$(az webapp deployment list-publishing-credentials \
            --name "$APP_NAME" --resource-group "$RG" \
            --query publishingPassword -o tsv)"

          # Zip build CONTENTS (not the build/ directory itself) so that
          # index.html lands at wwwroot/ and `serve -s .` serves it correctly.
          cd frontend/build && zip -qr ../../frontend.zip . && cd ../..
          echo "Frontend zip: $(du -sh frontend.zip | cut -f1)"

          echo "Uploading frontend zip (sync)..."
          for attempt in $(seq 1 5); do
            CODE=$(curl -sS -m 180 -u "$USER:$PW" -o /tmp/fe_deploy.out -w "%{http_code}" \
              -X POST "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy?isAsync=false" \
              -H "Content-Type: application/zip" \
              --data-binary @frontend.zip || echo "000")
            echo "Attempt $attempt → HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "Frontend deployed successfully"; exit 0; }
            if [ "$CODE" = "409" ]; then
              echo "Kudu busy — waiting 60 s before retry"
              sleep 60; continue
            fi
            echo "Unexpected response: $(cat /tmp/fe_deploy.out)"
            sleep 20
          done
          echo "Frontend deploy failed after 5 attempts (last HTTP $CODE)"; exit 1
